[project]
name = "ordenes-llm"
version = "0.1.0"
description = "LLMs que proponen órdenes de términos (LPO, …) verificados por un comprobador"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.12",  # fase 2 (interpretaciones polinómicas)
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["terminos", "lpo", "llm"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
